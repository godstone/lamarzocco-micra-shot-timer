; LilyGO T-Display-S3-AMOLED 1.43" (ESP32-S3-R8, 16MB flash, 8MB OPI PSRAM)
; Round 466x466 AMOLED, SH8601 driver over QSPI, FT3168 touch.

[env:t-display-amoled-143]
; Use the actively-maintained pioarduino fork. The official `espressif32` platform is stale
; and fails to fetch toolchain packages (e.g. toolchain-riscv32-esp 8.4.0+2021r2-patch3).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ESP32-S3-R8: 16MB QIO flash + 8MB OPI PSRAM
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Set DEMO_MODE=0 once the cloud client + request signing are implemented.
    -DDEMO_MODE=1

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.9
    bblanchon/ArduinoJson @ ^7.0.0
    tzapu/WiFiManager @ ^2.0.17

; Flashing note (ESP32-S3): if the port doesn't appear, hold BOOT, tap RST, release BOOT to
; force download mode. With USB CDC On Boot enabled, normal auto-upload usually works.
